version: 2

models:
  - name: stg_polymarket_markets
    description: >
      One row per Polymarket binary market, canonical market_id/answer_id
      derived from negRiskMarketID grouping (see ADR-0011 and this model's
      own header comment for the full reasoning).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - market_id
              - answer_id
    columns:
      - name: condition_id
        tests:
          - not_null
          - unique
      - name: question
        tests:
          - not_null

  - name: stg_polymarket_trades
    description: >
      One row per real Yes-side trade fill, capped at the 10,000 most
      recent per market by Polymarket's own /trades endpoint (see
      ADR-0011). Not the primary reconstruction source; see
      stg_polymarket_prices for that.
    tests:
      - unique:
          column_name: trade_id
    columns:
      - name: condition_id
        tests:
          - not_null
      - name: price
        tests:
          - not_null

  - name: stg_polymarket_prices
    description: >
      One row per hourly-cadence price sample, the primary source for
      Polymarket probability reconstruction (see ADR-0011).
    columns:
      - name: market_id
        tests:
          - not_null
      - name: created_at
        tests:
          - not_null
      - name: price
        tests:
          - not_null
