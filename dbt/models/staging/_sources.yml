version: 2

sources:
  - name: manifold_raw
    description: >
      Parquet output from spark/flatten_to_parquet.py, typed, flattened,
      but zero business logic applied (see ADR-0005). DuckDB reads these
      files directly via external_location below, no separate "load into
      the warehouse" step. Postgres has no equivalent way to query a
      Parquet file in place, so the postgres target (see ADR-0004) needs
      an actual load step first: spark/load_parquet_to_postgres.py creates
      real tables in this same schema before dbt runs. DuckDB's
      external_location config takes priority over schema/database for
      this source when duckdb is the active target, so this one file
      serves both adapters without a target-conditional.
    schema: raw
    meta:
      external_location: "../data/processed/{name}/*.parquet"
    tables:
      - name: markets
      - name: market_answers
      - name: bets

  - name: polymarket_raw
    description: >
      Parquet output from spark/flatten_polymarket.py, see ADR-0011. Same
      external_location/postgres-load pattern as manifold_raw above, a
      separate source rather than reusing manifold_raw's name since these
      are genuinely different raw datasets, not different rows of the same
      one.
    schema: raw
    meta:
      external_location: "../data/processed/{name}/*.parquet"
    tables:
      - name: polymarket_markets
      - name: polymarket_trades
      - name: polymarket_prices
