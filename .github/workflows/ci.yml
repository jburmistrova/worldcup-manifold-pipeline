# Runs the real pipeline (Spark -> dbt build+test) on every push, against a
# small committed fixture (tests/fixtures/raw/) instead of the live Manifold
# and Polymarket APIs. Deliberately NOT hitting either real API here: this
# project found Manifold's own API to be slow/rate-limited under rapid calls
# (see lessons_learned.md), and there's no reason to re-pull the same ~600
# Manifold markets or ~6,300 Polymarket markets on every push anyway. CI that
# depends on a third-party API's mood is exactly the kind of flaky CI worth
# avoiding.
#
# The Polymarket fixture is 2 real events (a 3-market negRisk-grouped,
# resolved pair and a standalone, unresolved single market), chosen for
# small, naturally-occurring trade/price counts, not truncated from a
# bigger sample, so every row here is a real, unmodified API response
# object, same discipline as the Manifold fixture and ADR-0006.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Java (PySpark requirement)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Seed data/raw/ from the committed fixture
        run: |
          mkdir -p data/raw
          cp tests/fixtures/raw/*.jsonl data/raw/

      - name: "Spark: flatten raw JSON to Parquet"
        run: python spark/flatten_to_parquet.py

      - name: "Spark: flatten Polymarket raw JSON to Parquet"
        run: python spark/flatten_polymarket.py

      - name: dbt deps (installs dbt_utils, per dbt/packages.yml)
        working-directory: dbt
        run: dbt deps

      - name: dbt build (staging -> intermediate -> marts, with tests)
        working-directory: dbt
        run: dbt build --profiles-dir .

      # Polymarket is gated behind INCLUDE_POLYMARKET (default off, see
      # int_all_market_ticks.sql), so the build above never touches it. A
      # second, opt-in build here proves the gated half actually works
      # too, not just that the default path still builds without it. DuckDB
      # only: load_parquet_to_postgres.py has no Polymarket support (its
      # own TABLES list is Manifold-only), so this doesn't run again against
      # the postgres target below, a real, deliberate scope boundary, not
      # an oversight (see ADR-0012).
      - name: dbt build with Polymarket included (INCLUDE_POLYMARKET=true)
        working-directory: dbt
        env:
          INCLUDE_POLYMARKET: "true"
        run: dbt build --profiles-dir . --full-refresh

      # Parquet output from the Spark step above is reused as-is, not
      # regenerated. DuckDB reads that Parquet directly (see
      # dbt/models/staging/_sources.yml); Postgres has no equivalent, so it
      # needs actual tables loaded first, which is all this step does.
      - name: Load Parquet into Postgres (no DuckDB-style direct read)
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: worldcup
          POSTGRES_PASSWORD: worldcup_ci_only
          POSTGRES_DB: worldcup
        run: python spark/load_parquet_to_postgres.py

      - name: dbt build against Postgres (StatefulSet target, see ADR-0004)
        working-directory: dbt
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: worldcup
          POSTGRES_PASSWORD: worldcup_ci_only
          POSTGRES_DB: worldcup
        run: dbt build --profiles-dir . --target postgres
    services:
      # A throwaway service container, not the real k8s/postgres.yaml
      # StatefulSet: CI needs to verify the postgres dbt target actually
      # works, not spin up a whole Kubernetes cluster to prove it. The
      # credential above is only ever reachable from inside this one CI
      # run's network namespace, not a real secret worth protecting.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: worldcup
          POSTGRES_PASSWORD: worldcup_ci_only
          POSTGRES_DB: worldcup
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
